<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A realtime table for Vampire: The Masquerade 20th Anniversary Edition." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Coterie</title>
    <script>
      // The reader's skin, before first paint (see lib/theme.svelte.ts).
      try {
        var t = localStorage.getItem('coterie-theme');
        if (t) document.documentElement.dataset.theme = t;
        var f = localStorage.getItem('coterie-theme-fonts');
        if (f) {
          var l = document.createElement('link');
          l.id = 'theme-fonts';
          l.rel = 'stylesheet';
          l.href = f;
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
